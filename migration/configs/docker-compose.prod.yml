# ============================================
# Backend uniquement (frontend sur Vercel)

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-neondb_owner}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-ep-nameless-wildflower-atnndy1x-pooler.c-9.us-east-1.aws.neon.tech}:5432/${POSTGRES_DB:-neondb}?sslmode=require
      DIRECT_URL: postgresql://${POSTGRES_USER:-neondb_owner}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-ep-nameless-wildflower-atnndy1x.c-9.us-east-1.aws.neon.tech}:5432/${POSTGRES_DB:-neondb}?sslmode=require
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      
      # CORS - Inclure le domaine Vercel
      CORS_ORIGIN: ${CORS_ORIGIN:-https://stock.sekuu.com,https://stock.byevastore.com,https://stockn.byevastore.com,https://new.byevastore.com}
      
      # Cloudflare R2
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL}

      # Mail Configuration
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      MAIL_FALLBACK_ENABLED: ${MAIL_FALLBACK_ENABLED:-true}
      MAIL_FALLBACK_PROVIDER: ${MAIL_FALLBACK_PROVIDER:-ses}
      ENABLE_EMAILS: ${ENABLE_EMAILS:-true}

      # AWS SES
      AWS_SES_SMTP_USERNAME: ${AWS_SES_SMTP_USERNAME}
      AWS_SES_SMTP_PASSWORD: ${AWS_SES_SMTP_PASSWORD}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME}

      # Resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}

      # Sentry
      SENTRY_DSN: ${SENTRY_DSN}

      # NotchPay
      NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY}
      NOTCHPAY_PRIVATE_KEY: ${NOTCHPAY_PRIVATE_KEY}
      NOTCHPAY_MODE: ${NOTCHPAY_MODE}
      NOTCHPAY_WEBHOOK_SECRET: ${NOTCHPAY_WEBHOOK_SECRET}
      NOTCHPAY_DEFAULT_CURRENCY: ${NOTCHPAY_DEFAULT_CURRENCY}

      # Sync
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-100}
      SYNC_CONFLICT_STRATEGY: ${SYNC_CONFLICT_STRATEGY:-last-write-wins}
    ports:
      - "127.0.0.1:3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"

networks:
  default:
    driver: bridge
