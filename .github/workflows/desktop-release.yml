name: Build & Publish Desktop

# Triggered manually by creating a tag like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write  # Required to create/upload GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      # ── Backend ──
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build seed DB + backend
        working-directory: backend
        run: |
          npm run desktop:build-seed-db
          npm run build

      # ── Frontend ──
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (desktop mode)
        working-directory: frontend
        run: npm run build:desktop

      # ── Desktop (Electron) ──
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build & publish installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockManagement-Installer
          path: desktop/dist/StockManagement-Setup-*.exe
          if-no-files-found: error
