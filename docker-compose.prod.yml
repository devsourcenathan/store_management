version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stock_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stock_management}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-https://stock.sekuu.com,https://stock.byevastore.com}
      
      # AWS S3
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

      # Mail Configuration
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      MAIL_FALLBACK_ENABLED: ${MAIL_FALLBACK_ENABLED:-true}
      MAIL_FALLBACK_PROVIDER: ${MAIL_FALLBACK_PROVIDER:-ses}
      ENABLE_EMAILS: ${ENABLE_EMAILS:-true}

      # AWS SES
      AWS_SES_SMTP_USERNAME: ${AWS_SES_SMTP_USERNAME}
      AWS_SES_SMTP_PASSWORD: ${AWS_SES_SMTP_PASSWORD}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME}

      # Resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}

      # Sync
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-100}
      SYNC_CONFLICT_STRATEGY: ${SYNC_CONFLICT_STRATEGY:-last-write-wins}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stock-network
    ports:
      - "127.0.0.1:3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://stockapi.sekuu.com/api
    container_name: stock-frontend
    restart: unless-stopped
    networks:
      - stock-network
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
    driver: local

networks:
  stock-network:
    driver: bridge