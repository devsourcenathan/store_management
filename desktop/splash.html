<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #2563eb 0%, #4338ca 100%);
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      max-width: 420px;
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      background: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .logo svg { width: 32px; height: 32px; color: #2563eb; }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.85);
      margin-bottom: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 1.25rem;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.9);
      min-height: 1.25rem;
      line-height: 1.4;
    }
    .dots::after {
      content: "";
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ""; }
      40% { content: "."; }
      60% { content: ".."; }
      80%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
    <h1>Roxanne App</h1>
    <p class="subtitle">Gestion de stock desktop</p>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status">Démarrage<span class="dots"></span></p>
  </div>
  <script>
    window.setStatus = function (text) {
      var el = document.getElementById("status");
      if (!el) return;
      el.textContent = text || "";
      el.classList.remove("dots");
    };
  </script>
</body>
</html>
